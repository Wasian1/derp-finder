name: Scrape Da Derps

on:
  schedule:
    # Every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        fail-fast: false
        matrix:
          include:
            - user_name: "Dan"
              csv_file: "dan.csv"
              delivery_email: "dcfitzsimmons1995@gmail.com"

            - user_name: "Ania"
              csv_file: "ania.csv"
              delivery_email: "thewasian1@gmail.com"

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install Project Packages
      run: |
        python -m pip install --upgrade pip
        pip install playwright pandas openpyxl python-dotenv

    - name: Install System Virtual Display Packages (xvfb)
      # This installs a virtual desktop layer so we can run headless=False on a headless server
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Initialize Playwright Chromium Engine
      run: playwright install chromium

    - name: Execute Scraper Engine via Virtual Framebuffer
      
      env:
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        TARGET_CSV_NAME: ${{ matrix.csv_file }}
        RECIPIENT_EMAIL: ${{ matrix.delivery_email }}

      # xvfb-run opens a fake 1920x1080 display wrapper right before executing your python script
      run: xvfb-run --server-args="-screen 0 1920x1080x24" python src/scraper/main.py
